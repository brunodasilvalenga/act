version: 2

builds:
  - binary: act
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - repository:
      owner: brunodasilvalenga
      name: homebrew-tap
    homepage: https://github.com/brunodasilvalenga/act
    description: AWS Connect TUI - connect to EC2 instances via Session Manager
    license: MIT
    install: |
      bin.install "act"
